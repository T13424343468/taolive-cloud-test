name: build-apk
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 发布 APK（Release）
        run: dotnet publish src/TaoLive.Tv -c Release -f net10.0-android36.0
      - name: 落账
        run: |
          ls -l src/TaoLive.Tv/bin/Release/net10.0-android36.0/publish/*.apk
          sha256sum src/TaoLive.Tv/bin/Release/net10.0-android36.0/publish/*-Signed.apk | tee apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: taolive-apk
          path: |
            src/TaoLive.Tv/bin/Release/net10.0-android36.0/publish/*-Signed.apk
            apk.sha256
          if-no-files-found: error
