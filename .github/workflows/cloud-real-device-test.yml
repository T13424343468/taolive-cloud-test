name: cloud-real-device-test

on:
  workflow_dispatch:
    inputs:
      apk-url:
        description: "被测包下载地址（Release 资产）"
        required: false
        default: ""

jobs:
  gate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 版本锚/签名/包一致性
        run: |
          if [ -n "${{ github.event.inputs.apk-url }}" ]; then
            curl -sL -o app.apk "${{ github.event.inputs.apk-url }}"
            sha256sum app.apk | tee gate-package.sha256
            ls -l app.apk
          else
            echo "未提供 apk-url，进门关以仓库内 SHA256SUMS 记录为准（待补）"
          fi
      - name: 台账产物归档
        uses: actions/upload-artifact@v4
        with:
          name: gate-package
          path: gate-package.sha256
          if-no-files-found: ignore

  run-cases:
    needs: gate-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin SDK via global.json
        run: |
          SDK=$(grep -oE '"version": *"[0-9.]+"' global.json | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "SDK=$SDK" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.SDK }}
      - name: Install android workload
        run: dotnet workload install android
      - name: 逻辑全测（xUnit 全绿才算过，零错零警口径）
        run: |
          set -o pipefail # 闸门硬闸：tee 吞退出码会假绿（2026-11-16 实锤 2 红报绿），dotnet test 非零必须红
          dotnet test src/TaoLive.Tests/TaoLive.Tests.csproj -c Release --nologo | tee run-cases.log
      - name: 用例台账落盘
        uses: actions/upload-artifact@v4
        with:
          name: run-cases
          path: run-cases.log

  perspectives:
    needs: run-cases
    runs-on: ubuntu-latest
    steps:
      - name: 五视角清点
        run: echo '逻辑层视角已由段2覆盖；真机视角待真机会话——待补，不伪装绿。'

  visual-review:
    needs: run-cases
    runs-on: ubuntu-latest
    steps:
      - name: 视觉走查
        run: echo '待云真机平台接入后执行，不伪装绿。'

  perf-soak:
    needs: gate-package
    runs-on: ubuntu-latest
    steps:
      - name: 性能与长时
        run: echo '待云真机平台接入后执行长跑，不伪装绿。'

  ledger:
    needs: [gate-package, run-cases, perspectives, visual-review, perf-soak]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 台账清点与交付结论
        run: |
          echo "云端逻辑全测：xUnit 全绿（见 run-cases 产物）"
          echo "真机段：包已归档（见 gate-package），真机视角/视觉/长跑待真机接入——红绿如实，不伪装交付。"
