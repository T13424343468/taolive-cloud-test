name: emulator-test
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  install-and-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host capability probe
        run: |
          uname -a
          nproc
          free -h
          ls -l /dev/kvm || echo "NO_KVM_DEVICE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install classic-engine host dependencies (Qt5/X11/GL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libqt5widgets5 libqt5gui5 libqt5core5a libqt5svg5 libqt5network5 libx11-6 libgl1

      - name: Install Android SDK (base)
        run: |
          ANDROID_HOME=$RUNNER_TEMP/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-24"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install ARM32 system image (API 24, has kernel-qemu)
        run: |
          set -e
          yes | sdkmanager "system-images;android-24;default;armeabi-v7a"
          ls "$ANDROID_HOME/system-images/android-24/default/armeabi-v7a/" | head -20
          test -f "$ANDROID_HOME/system-images/android-24/default/armeabi-v7a/kernel-qemu" || { echo "NO_KERNEL_QEMU"; exit 1; }
          echo "KERNEL_QEMU_PRESENT"

      - name: Replace emulator with 28.0.25 (last release with classic/QEMU1 ARM engine)
        run: |
          set -e
          curl -sSL -o emu28.zip https://dl.google.com/android/repository/emulator-linux-5395263.zip
          rm -rf "$ANDROID_HOME/emulator"
          unzip -q emu28.zip -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/emulator/" | head -20
          test -f "$ANDROID_HOME/emulator/emulator64-arm" || { echo "NO_CLASSIC_ENGINE_BINARY"; exit 1; }
          chmod +x "$ANDROID_HOME/emulator/emulator64-arm"
          "$ANDROID_HOME/emulator/emulator64-arm" -version | head -2 || { echo "CLASSIC_ENGINE_WONT_LOAD"; ldd "$ANDROID_HOME/emulator/emulator64-arm" | grep 'not found'; exit 1; }
          echo "CLASSIC_ENGINE_OK"

      - name: Create AVD (API24 ARM32)
        run: |
          set -e
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export ANDROID_USER_HOME=$HOME/.android
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n testavd -k "system-images;android-24;default;armeabi-v7a" || true
          CFG="$ANDROID_AVD_HOME/testavd.avd/config.ini"
          cat "$CFG"
          # classic 引擎需要有效 skin；且明确关闭 GPU 走 -gpu off
          grep -q '^skin.name=' "$CFG" && sed -i 's|^skin.name=.*|skin.name=WXGA720|' "$CFG" || echo 'skin.name=WXGA720' >> "$CFG"
          grep -q '^skin.path=' "$CFG" && sed -i 's|^skin.path=.*|skin.path=platforms/android-24/skins/WXGA720|' "$CFG" || echo 'skin.path=platforms/android-24/skins/WXGA720' >> "$CFG"
          grep -q '^hw.gpu.enabled=' "$CFG" && sed -i 's|^hw.gpu.enabled=.*|hw.gpu.enabled=no|' "$CFG" || echo 'hw.gpu.enabled=no' >> "$CFG"
          echo "--- patched config ---"
          cat "$CFG"

      - name: Boot with classic engine (TCG ARM emulation)
        run: |
          set -e
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export ANDROID_USER_HOME=$HOME/.android
          EMU="$ANDROID_HOME/emulator/emulator64-arm"
          "$EMU" -list-avds || true
          set -x
          "$EMU" @testavd -engine classic -no-window -no-audio -no-boot-anim -no-snapshot -no-accel -gpu off -memory 2048 -cores 2 -verbose > emulator.log 2>&1 &
          EMUPID=$!
          sleep 45
          echo "--- emulator log head ---"
          head -60 emulator.log || true
          if ! kill -0 $EMUPID 2>/dev/null; then
            echo "EMULATOR_DIED_AT_START"
            cat emulator.log
            exit 1
          fi
          echo "ENGINE_ALIVE_AFTER_45S"
          # 设备出现（fast-fail：引擎挂了立即报，最多等 20 分钟）
          DEAD=0
          timeout 1200 adb wait-for-device || DEAD=1
          if [ $DEAD -ne 0 ]; then
            if ! kill -0 $EMUPID 2>/dev/null; then
              echo "EMULATOR_DIED_DURING_WAIT_FOR_DEVICE"
            else
              echo "DEVICE_NEVER_APPEARED"
            fi
            tail -100 emulator.log
            exit 1
          fi
          echo "DEVICE_APPEARED"
          # 等待开机完成，每轮检查引擎进程存活（TCG 下可能需要 30-90 分钟）
          START=$SECONDS
          while true; do
            if ! kill -0 $EMUPID 2>/dev/null; then
              echo "EMULATOR_DIED_DURING_BOOT"
              tail -120 emulator.log
              exit 1
            fi
            if timeout 40 adb shell getprop sys.boot_completed 2>/dev/null | grep -q '^1$'; then
              echo "BOOT_COMPLETED"
              break
            fi
            if [ $((SECONDS - START)) -gt 5400 ]; then
              echo "BOOT_TIMEOUT_90MIN"
              tail -120 emulator.log
              exit 1
            fi
            sleep 15
          done
          adb shell getprop ro.build.version.release || true
          adb shell getprop ro.product.cpu.abi || true

      - name: Dump emulator log
        if: always()
        run: |
          cat emulator.log 2>/dev/null | tail -150 || echo "NO_EMULATOR_LOG"

      - name: Install APK
        run: |
          adb install -r TaoLive-tv-v1.0-vc33-32bit.apk
          adb shell pm list packages | grep taolive || echo "PACKAGE_NOT_FOUND"

      - name: Launch app and capture evidence
        run: |
          adb logcat -c
          adb shell monkey -p com.taolive.tv -c android.intent.category.LAUNCHER 1 || true
          sleep 60
          adb shell "dumpsys activity activities | grep -i taolive" || echo "ACTIVITY_NOT_TOP"
          adb logcat -d > logcat-full.txt || true
          adb shell screencap -p /sdcard/launch.png && adb pull /sdcard/launch.png launch-60s.png || true
          sleep 120
          adb shell screencap -p /sdcard/launch.png && adb pull /sdcard/launch.png launch-180s.png || true
          adb shell "dumpsys activity processes | grep -i taolive | head -20" > proc-info.txt || true
          adb shell ps -A | grep taolive > proc-ps.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tao-live-vc33-cloud-evidence
          path: |
            logcat-full.txt
            launch-60s.png
            launch-180s.png
            proc-info.txt
            proc-ps.txt
            emulator.log
          if-no-files-found: warn
