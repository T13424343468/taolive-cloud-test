name: emulator-test
on:
  push:
    branches: [taolive-2p0]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - name: Pin SDK via global.json
        run: echo '{"sdk":{"version":"10.0.404","rollForward":"disable"}}' > global.json
      - name: Verify dotnet
        run: dotnet --version
      - name: Install android workload
        run: dotnet workload install android
      - name: Restore seven-project sequence
        run: |
          dotnet restore src/TaoLive.Tv/TaoLive.Tv.csproj -p:Configuration=Release
          for p in Model Foundation Session Players; do
            dotnet restore src/TaoLive.$p/TaoLive.$p.csproj -p:Configuration=Release
          done
      - name: Publish APK (trim+AOT default, dual ABI)
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet --version
          dotnet publish src/TaoLive.Tv -c Release --no-restore
          find src/TaoLive.Tv/bin -name "*.apk" -size +10M | head -1 | xargs -I{} cp {} TaoLive.apk
          ls -la TaoLive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: taolive-2p0-w1-apk
          path: TaoLive.apk
      - name: Badging anchor check
        run: |
          ANDROID_HOME=$RUNNER_TEMP/android-sdk
          CLT=$ANDROID_HOME/cmdline-tools/latest
          if [ ! -x "$CLT/bin/sdkmanager" ]; then
            mkdir -p $ANDROID_HOME/cmdline-tools
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          fi
          yes | $CLT/bin/sdkmanager --licenses > /dev/null || true
          [ -x "$(find $ANDROID_HOME -name aapt2 | head -1)" ] || $CLT/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;34.0.0"
          AAPT2=$(find $ANDROID_HOME -name aapt2 | head -1)
          [ -n "$AAPT2" ] || { echo "aapt2 not found after sdkmanager"; exit 1; }
          $AAPT2 dump badging TaoLive.apk | grep -E "^package|application-label" | head -5
          BADGE=$($AAPT2 dump badging TaoLive.apk | grep -E "^package" | head -1)
          echo "$BADGE"
          echo "$BADGE" | grep -q "com.taolive.tv" || { echo "BADGING ANCHOR MISMATCH"; exit 1; }
      - name: Signature chain verify (C1, vc55 同链)
        run: |
          ANDROID_HOME=$RUNNER_TEMP/android-sdk
          CLT=$ANDROID_HOME/cmdline-tools/latest
          [ -x "$(find $ANDROID_HOME -name apksigner | head -1)" ] || $CLT/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;34.0.0"
          APKSIGNER=$(find $ANDROID_HOME -name apksigner | head -1)
          echo "$APKSIGNER verify --print-certs TaoLive.apk"
          $APKSIGNER verify TaoLive.apk || { echo "APK NOT SIGNED"; exit 1; }
          CERT=$($APKSIGNER verify --print-certs TaoLive.apk | grep -i "SHA-256" | head -1)
          echo "$CERT"
          echo "$CERT" | grep -qi "c18030d3" || { echo "CERT CHAIN MISMATCH: expected C1 c18030d3..."; exit 1; }

  install-and-launch:
    runs-on: ubuntu-24.04
    needs: build-apk
    timeout-minutes: 120
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: taolive-2p0-w1-apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK (base)
        run: |
          ANDROID_HOME=$RUNNER_TEMP/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --list | awk '{gsub(/^ +/,""); sub(/ .*/,""); print}' | grep -E '^system-images;android-[0-9]+;[a-z_]+;x86_64$' | sort -u > /tmp/x86-images.txt || true
          PICK=""
          for CAND in "system-images;android-31;google_apis;x86_64" "system-images;android-30;google_apis;x86_64" "system-images;android-25;default;x86"; do
            if grep -qxF "$CAND" /tmp/x86-images.txt; then PICK="$CAND"; break; fi
          done
          [ -n "$PICK" ] || { echo "NO_X86_IMAGE_AVAILABLE"; cat /tmp/x86-images.txt; exit 1; }
          echo "PICKED=$PICK"; echo "PICK=$PICK" >> $GITHUB_ENV
          sdkmanager "platform-tools" "emulator" "$PICK"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH" >> $GITHUB_ENV

      - name: Create AVD (x86_64, houdini ARM translation)
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export ANDROID_USER_HOME=$HOME/.android
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n testavd -k "$PICK" || true
          CFG=$ANDROID_AVD_HOME/testavd.avd/config.ini
          grep -q '^hw.gpu.enabled=' "$CFG" && sed -i 's|^hw.gpu.enabled=.*|hw.gpu.enabled=no|' "$CFG" || echo 'hw.gpu.enabled=no' >> "$CFG"
          grep -q '^hw.gpu.mode=' "$CFG" && sed -i 's|^hw.gpu.mode=.*|hw.gpu.mode=off|' "$CFG" || echo 'hw.gpu.mode=off' >> "$CFG"
          grep -q '^hw.cpu.ncore=' "$CFG" && sed -i 's|^hw.cpu.ncore=.*|hw.cpu.ncore=4|' "$CFG" || echo 'hw.cpu.ncore=4' >> "$CFG"
          grep -q '^hw.ramSize=' "$CFG" && sed -i 's|^hw.ramSize=.*|hw.ramSize=2048|' "$CFG" || echo 'hw.ramSize=2048' >> "$CFG"

      - name: Grant KVM access (runner has /dev/kvm, needs permission)
        run: |
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && echo "KVM_GRANTED" || { echo "NO_KVM_DEVICE"; exit 1; }
          ls -l /dev/kvm
      - name: Boot x86_64 emulator (KVM)
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export ANDROID_USER_HOME=$HOME/.android
          EMU=$ANDROID_HOME/emulator/emulator
          "$EMU" @testavd -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 -show-kernel > emulator.log 2>&1 &
          EMUPID=$!
          sleep 45
          if ! kill -0 $EMUPID 2>/dev/null; then
            echo "EMULATOR_DIED_AT_START"; cat emulator.log; exit 1
          fi
          echo "ENGINE_ALIVE_AFTER_45S"

      - name: Wait for boot (bounded, fast-fail)
        run: |
          START=$SECONDS
          while true; do
            if timeout 40 adb wait-for-device; then
              if timeout 40 adb shell getprop sys.boot_completed 2>/dev/null | grep -q '^1$'; then
                echo "BOOT_COMPLETED"; break
              fi
            fi
            if [ $((SECONDS - START)) -gt 3600 ]; then
              echo "BOOT_TIMEOUT_60MIN"; tail -120 emulator.log || true; exit 1
            fi
            sleep 15
          done

      - name: Install APK
        run: |
          adb install -r TaoLive.apk
          adb shell pm list packages | grep taolive || echo "PACKAGE_NOT_FOUND"

      - name: Launch app and capture evidence
        run: |
          adb logcat -G 16M || true
          adb logcat -c
          (adb logcat -v time > logcat-continuous.txt 2>&1 &) || true
          adb shell monkey -p com.taolive.tv -c android.intent.category.LAUNCHER 1 || true
          sleep 60
          adb shell "dumpsys activity activities | grep -i taolive" || echo "ACTIVITY_NOT_TOP"
          adb logcat -d > logcat-full.txt || true
          adb shell screencap -p /sdcard/launch.png && adb pull /sdcard/launch.png launch-60s.png || true
          adb shell "dumpsys dropbox --print" > dropbox.txt 2>/dev/null || echo "NO_DROPBOX"
          grep -c taolive dropbox.txt > dropbox-taolive-count.txt || true

      - name: Blindspot A - per-screen visual walkthrough (10/30/60/120/300s)
        run: |
          mkdir -p walkthrough
          snap() {
            adb shell screencap -p /sdcard/w-$1.png && adb pull /sdcard/w-$1.png walkthrough/ || true
            adb shell rm -f /sdcard/w-$1.png || true
            adb shell uiautomator dump /sdcard/w-$1.xml >/dev/null 2>&1 \
              && adb pull /sdcard/w-$1.xml walkthrough/ \
              || echo "UIDUMP_FAIL_$1" >> walkthrough/uidump-fails.txt
            adb shell rm -f /sdcard/w-$1.xml || true
          }
          sleep 10; snap 010s
          sleep 20; snap 030s
          sleep 30; snap 060s
          sleep 60; snap 120s
          sleep 180; snap 300s
          ls -la walkthrough/

      - name: Blindspot B - segmented screen recording (36 min, background)
        run: |
          mkdir -p rec
          nohup bash -c '
            for i in $(seq -w 1 12); do
              timeout 200 adb shell screenrecord --time-limit 180 /sdcard/rec-$i.mp4 || true
              adb pull /sdcard/rec-$i.mp4 rec/ 2>/dev/null || true
              adb shell rm -f /sdcard/rec-$i.mp4 || true
            done
            touch rec/DONE
          ' > rec/recorder.log 2>&1 &
          echo "RECORDER_STARTED"

      - name: Blindspot C - 30 min long run with health checks
        run: |
          mkdir -p longrun
          for M in $(seq 1 10); do
            adb shell "dumpsys activity activities | grep -i taolive | head -3" > longrun/health-$M.txt 2>&1 || true
            adb logcat -d | grep -c "FATAL EXCEPTION" > longrun/fatal-count-$M.txt || true
            if [ $((M % 2)) -eq 0 ]; then
              adb shell screencap -p /sdcard/lr-$M.png && adb pull /sdcard/lr-$M.png longrun/ || true
              adb shell rm -f /sdcard/lr-$M.png || true
            fi
            if [ $((M % 3)) -eq 0 ]; then
              adb shell uiautomator dump /sdcard/ui-lr-$M.xml >/dev/null 2>&1 \
                && adb pull /sdcard/ui-lr-$M.xml longrun/ \
                || echo "UIDUMP_FAIL_lr_$M" >> longrun/uidump-fails.txt
              adb shell rm -f /sdcard/ui-lr-$M.xml || true
            fi
            sleep 180
          done
          echo "LONGRUN_30MIN_DONE"

      - name: Blindspot D - stop recording and final crash accounting
        run: |
          for WAIT in $(seq 1 20); do
            [ -f rec/DONE ] && break
            sleep 30
          done
          ls -la rec/ || true
          adb logcat -d > logcat-final.txt || true
          grep -c "FATAL EXCEPTION" logcat-final.txt > fatal-final-count.txt || true
          adb shell "dumpsys dropbox --print" > dropbox-final.txt 2>/dev/null || echo "NO_DROPBOX"
          grep -c taolive dropbox-final.txt > dropbox-final-taolive-count.txt || true
          adb shell screencap -p /sdcard/final.png && adb pull /sdcard/final.png final-state.png || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taolive-2p0-w1-crash-evidence
          path: |
            logcat-full.txt
            logcat-continuous.txt
            logcat-final.txt
            dropbox.txt
            dropbox-final.txt
            dropbox-final-taolive-count.txt
            fatal-final-count.txt
            launch-60s.png
            final-state.png
            emulator.log
            walkthrough/
            rec/
            longrun/
          if-no-files-found: warn
