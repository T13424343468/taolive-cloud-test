name: emulator-test
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'

jobs:
  install-and-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host capability probe
        run: |
          uname -a
          nproc
          free -h
          ls -l /dev/kvm || echo "NO_KVM_DEVICE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install classic-engine host dependencies (Qt5/X11/GL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libqt5widgets5 libqt5gui5 libqt5core5a libqt5svg5 libqt5network5 libx11-6 libgl1

      - name: Install Android SDK (base)
        run: |
          ANDROID_HOME=$RUNNER_TEMP/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          # round9: dynamic pick of an x86 image with ARM translation (houdini); never hard-code a package again
          # sdkmanager lines look like: "  system-images;android-31;google_apis;x86_64 | 13 | ..." -> strip spaces and trailing text first
          sdkmanager --list | awk '{gsub(/^ +/,""); sub(/ .*/,""); print}' | grep -E '^system-images;android-[0-9]+;[a-z_]+;x86_64$' | sort -u | tee /tmp/x86-images.txt
          sdkmanager --list | awk '{gsub(/^ +/,""); sub(/ .*/,""); print}' | grep -E '^system-images;android-(2[1-7]);[a-z_]+;x86$' | sort -u >> /tmp/x86-images.txt || true
          PICK=""
          for CAND in "system-images;android-31;google_apis;x86_64" "system-images;android-30;google_apis;x86_64" "system-images;android-25;google_apis;x86" "system-images;android-24;google_apis;x86" "system-images;android-25;default;x86"; do
            if grep -qxF "$CAND" /tmp/x86-images.txt; then PICK="$CAND"; break; fi
          done
          [ -n "$PICK" ] || { echo "NO_X86_IMAGE_AVAILABLE"; cat /tmp/x86-images.txt; exit 1; }
          echo "PICKED=$PICK"
          echo "PICK=$PICK" >> $GITHUB_ENV
          sdkmanager "platform-tools" "platforms;android-24" "emulator" "$PICK"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Verify ARM translation layer present in image
        run: |
          set -e
          IMG=$(echo "$ANDROID_HOME/system-images/$PICK" | tr ';' '/')
          IMG=${IMG/x86_64/x86_64}
          echo "IMG=$IMG"
          ls "$IMG" | head -20
          echo "--- translation layer files ---"
          find "$ANDROID_HOME/system-images" -iname '*houdini*' | head -20 || true
          find "$ANDROID_HOME/system-images" -iname '*ndk_translation*' | head -10 || true
          echo "--- image abilist ---"
          BP=$(find "$IMG" -name build.prop | head -1)
          echo "build.prop: $BP"
          grep -a 'cpu.abilist' "$BP" || echo "NO_ABILIST_PROP"
          if ! grep -qa 'cpu.abilist' "$BP" | grep -q arm; then
            echo "NO_ARM_IN_ABILIST_TRANSLATION_UNLIKELY"
          fi

      - name: Create AVD (x86_64 Google Play, houdini ARM translation)
        run: |
          set -e
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export ANDROID_USER_HOME=$HOME/.android
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n testavd -k "$PICK" || true
          CFG=$ANDROID_AVD_HOME/testavd.avd/config.ini
          cat "$CFG"
          # software rendering; extra boot props for headless CI
          grep -q '^hw.gpu.enabled=' "$CFG" && sed -i 's|^hw.gpu.enabled=.*|hw.gpu.enabled=no|' "$CFG" || echo 'hw.gpu.enabled=no' >> "$CFG"
          grep -q '^hw.gpu.mode=' "$CFG" && sed -i 's|^hw.gpu.mode=.*|hw.gpu.mode=off|' "$CFG" || echo 'hw.gpu.mode=off' >> "$CFG"
          grep -q '^hw.cpu.ncore=' "$CFG" && sed -i 's|^hw.cpu.ncore=.*|hw.cpu.ncore=4|' "$CFG" || echo 'hw.cpu.ncore=4' >> "$CFG"
          grep -q '^hw.ramSize=' "$CFG" && sed -i 's|^hw.ramSize=.*|hw.ramSize=2048|' "$CFG" || echo 'hw.ramSize=2048' >> "$CFG"
          echo "--- patched config ---"
          cat "$CFG"

      - name: Boot x86_64 emulator (TCG, no KVM)
        run: |
          set -x
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export ANDROID_USER_HOME=$HOME/.android
          EMU=$ANDROID_HOME/emulator/emulator
          "$EMU" -list-avds || true
          set +e
          # -no-accel: runners have no KVM; x86_64 TCG is far faster than ARM32 TCG
          "$EMU" @testavd -no-window -no-audio -no-boot-anim -no-snapshot -no-accel -gpu swiftshader_indirect -memory 3072 -show-kernel > emulator.log 2>&1 &
          EMUPID=$!
          sleep 45
          echo "--- emulator log head ---"
          head -60 emulator.log || true
          if ! kill -0 $EMUPID 2>/dev/null; then
            echo "EMULATOR_DIED_AT_START"
            cat emulator.log
            exit 1
          fi
          echo "ENGINE_ALIVE_AFTER_45S"

      - name: Wait for boot (bounded, fast-fail)
        run: |
          START=$SECONDS
          while true; do
            if timeout 40 adb wait-for-device; then
              if timeout 40 adb shell getprop sys.boot_completed 2>/dev/null | grep -q '^1$'; then
                echo "BOOT_COMPLETED"
                break
              fi
            fi
            if [ $((SECONDS - START))  -gt 6000 ]; then
              echo "BOOT_TIMEOUT_100MIN"
              tail -120 emulator.log || true
              exit 1
            fi
            sleep 15
          done
          adb shell getprop ro.build.version.release || true
          adb shell getprop ro.product.cpu.abilist || true

      - name: Install APK
        run: |
          # ARM32 APK on x86_64 image relies on houdini translation
          adb install -r TaoLive.apk
          adb shell pm list packages | grep taolive || echo "PACKAGE_NOT_FOUND"

      - name: Launch app and capture evidence
        run: |
          adb logcat -G 16M || true
          adb logcat -c
          # 全程持续落盘：后台抓 logcat 直到取证结束，环形缓冲噪音不再刷掉 app 崩溃行
          (adb logcat -v time > logcat-continuous.txt 2>&1 &) || true
          adb shell monkey -p com.taolive.tv -c android.intent.category.LAUNCHER 1 || true
          sleep 60
          adb shell "dumpsys activity activities | grep -i taolive" || echo "ACTIVITY_NOT_TOP"
          adb logcat -d > logcat-full.txt || true
          adb shell screencap -p /sdcard/launch.png && adb pull /sdcard/launch.png launch-60s.png || true
          sleep 120
          adb shell screencap -p /sdcard/launch.png && adb pull /sdcard/launch.png launch-180s.png || true
          adb shell "dumpsys activity processes | grep -i taolive | head -20" > proc-info.txt || true
          adb shell "ps -A | grep taolive" > proc-ps.txt || true
          # 崩溃归因金源：dropbox 全量（am_crash 全字段，窗口外崩溃也能归因）
          adb shell "dumpsys dropbox --print" > dropbox.txt 2>/dev/null || echo "NO_DROPBOX"
          grep -c taolive dropbox.txt > dropbox-taolive-count.txt || true

      - name: Dump emulator log
        if: always()
        run: cat emulator.log 2>/dev/null | tail -150 || echo "NO_EMULATOR_LOG"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tao-live-vc48-crash-evidence
          path: |
            logcat-full.txt
            logcat-continuous.txt
            dropbox.txt
            launch-60s.png
            launch-180s.png
            proc-info.txt
            proc-ps.txt
            emulator.log
          if-no-files-found: warn

  build-apk:
    # 云上出包治本：沙箱 3.8G 内存 ILLink OOM 三连败+swap 被禁（2026-11-14 支援班）；
    # runner 7G 内存，restore 闭包互踩需三步序列（Tv 显式 TFM→BLL→Model）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.320'
      # SDK 11 抢路：NETSDK1202（net9-android EOL）+NU1101（SDK11 对 android-arm 行为不同）——
      # 2026-11-14 支援班：显式把 HOME/.dotnet 顶到 PATH 最前，restore/publish 全用 9.0.320
      - name: Pin dotnet 9.0.320
        run: echo "$HOME/.dotnet" >> $GITHUB_PATH
      - name: Install android workload
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet --version
          dotnet workload install android
      - name: Restore three-step sequence
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet --version
          dotnet restore src/TaoLive.UI.Android.Tv/TaoLive.UI.Android.Tv.csproj -p:Configuration=Release -p:TargetFramework=net9.0-android35.0
          dotnet restore src/TaoLive.BLL/TaoLive.BLL.csproj -p:Configuration=Release -p:TargetFramework=net8.0
          dotnet restore src/TaoLive.Model/TaoLive.Model.csproj -p:Configuration=Release -p:TargetFramework=net8.0
      - name: Publish APK (trim+AOT default)
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet --version
          dotnet publish src/TaoLive.UI.Android.Tv -c Release -f net9.0-android35.0 --no-restore
          find src/TaoLive.UI.Android.Tv/bin -name "*.apk" -size +20M | head -1 | xargs -I{} cp {} TaoLive.apk
          ls -la TaoLive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: taolive-vc53-apk
          path: TaoLive.apk
