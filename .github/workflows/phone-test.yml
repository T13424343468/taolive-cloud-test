name: phone-emulator-test

on:
  workflow_dispatch:
  push:
    branches: [phone-src]

jobs:
  # 闸二：云端 build（.NET 10 Android，手机版独立工程）
  build-phone-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phone-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - name: Install android workload
        run: dotnet workload install android
      - name: Build Release (single-thread, no gcServer — 防 ILLink OOM)
        run: |
          export DOTNET_gcServer=0
          dotnet build src/TaoLive.Phone -c Release -maxcpucount:1 -p:UseSharedCompilation=false
      - name: Build Debug
        run: |
          export DOTNET_gcServer=0
          dotnet build src/TaoLive.Phone -c Debug -maxcpucount:1 -p:UseSharedCompilation=false
      - uses: actions/upload-artifact@v4
        with:
          name: taolive-phone-apk
          path: src/TaoLive.Phone/bin/Release/net10.0-android36.0/*-Signed.apk
          if-no-files-found: error

  # 闸三：云真机（x86_64 + houdini ARM 转译），八道关证据
  install-and-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Host capability probe
        run: |
          uname -a
          nproc
          free -h
          ls -l /dev/kvm || echo "NO_KVM_DEVICE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install classic-engine host dependencies (Qt5/X11/GL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libqt5widgets5 libqt5gui5 libqt5core5a libqt5svg5 libqt5network5 libx11-6 libgl1

      - name: Install Android SDK (base)
        run: |
          ANDROID_HOME=$RUNNER_TEMP/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --list | awk '{gsub(/^ +/,""); sub(/ .*/,""); print}' | grep -E '^system-images;android-[0-9]+;[a-z_]+;x86_64$' | sort -u | tee /tmp/x86-images.txt
          PICK=""
          for CAND in "system-images;android-31;google_apis;x86_64" "system-images;android-30;google_apis;x86_64"; do
            if grep -qxF "$CAND" /tmp/x86-images.txt; then PICK="$CAND"; break; fi
          done
          [ -n "$PICK" ] || { echo "NO_X86_IMAGE_AVAILABLE"; cat /tmp/x86-images.txt; exit 1; }
          echo "PICKED=$PICK"
          echo "PICK=$PICK" >> $GITHUB_ENV
          sdkmanager "platform-tools" "emulator" "$PICK"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Create AVD
        run: |
          set -e
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export ANDROID_USER_HOME=$HOME/.android
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n testavd -k "$PICK" || true
          CFG=$ANDROID_AVD_HOME/testavd.avd/config.ini
          grep -q '^hw.gpu.enabled=' "$CFG" && sed -i 's|^hw.gpu.enabled=.*|hw.gpu.enabled=no|' "$CFG" || echo 'hw.gpu.enabled=no' >> "$CFG"
          grep -q '^hw.gpu.mode=' "$CFG" && sed -i 's|^hw.gpu.mode=.*|hw.gpu.mode=off|' "$CFG" || echo 'hw.gpu.mode=off' >> "$CFG"
          grep -q '^hw.cpu.ncore=' "$CFG" && sed -i 's|^hw.cpu.ncore=.*|hw.cpu.ncore=4|' "$CFG" || echo 'hw.cpu.ncore=4' >> "$CFG"
          grep -q '^hw.ramSize=' "$CFG" && sed -i 's|^hw.ramSize=.*|hw.ramSize=2048|' "$CFG" || echo 'hw.ramSize=2048' >> "$CFG"
          cat "$CFG"

      - name: Boot emulator (KVM if available, else TCG)
        run: |
          set -x
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export ANDROID_USER_HOME=$HOME/.android
          # KVM 探测：runner 已带 /dev/kvm（root:kvm），runner 用户在 kvm 组即可硬件加速；
          # x86_64 无加速会被新版模拟器拒绝（"requires hardware acceleration"），故有 KVM 必用 KVM
          if [ -w /dev/kvm ] || groups | grep -qw kvm; then
            ACCEL=""
            echo "USING_KVM"
          else
            sudo chmod 666 /dev/kvm 2>/dev/null && ACCEL="" && echo "USING_KVM_AFTER_CHMOD" || ACCEL="-no-accel"
            [ -n "$ACCEL" ] && echo "USING_TCG_FALLBACK"
          fi
          EMU=$ANDROID_HOME/emulator/emulator
          set +e
          "$EMU" @testavd -no-window -no-audio -no-boot-anim -no-snapshot $ACCEL -gpu swiftshader_indirect -memory 3072 -show-kernel > emulator.log 2>&1 &
          EMUPID=$!
          sleep 45
          if ! kill -0 $EMUPID 2>/dev/null; then
            echo "EMULATOR_DIED_AT_START"
            cat emulator.log
            exit 1
          fi
          echo "ENGINE_ALIVE_AFTER_45S"

      - name: Wait for boot (bounded, fast-fail)
        run: |
          START=$SECONDS
          while true; do
            if timeout 40 adb wait-for-device; then
              if timeout 40 adb shell getprop sys.boot_completed 2>/dev/null | grep -q '^1$'; then
                echo "BOOT_COMPLETED"
                break
              fi
            fi
            if [ $((SECONDS - START)) -gt 6000 ]; then
              echo "BOOT_TIMEOUT_100MIN"
              tail -120 emulator.log || true
              exit 1
            fi
            sleep 15
          done
          adb shell getprop ro.build.version.release || true
          adb shell getprop ro.product.cpu.abilist || true

      - name: Install APK (手机版)
        run: |
          adb install -r TaoLive-phone.apk
          adb shell pm list packages | grep com.taolive.phone || echo "PACKAGE_NOT_FOUND"

      - name: Launch app and capture evidence
        run: |
          adb logcat -G 16M || true
          adb logcat -c
          (adb logcat -v time > logcat-continuous.txt 2>&1 &) || true
          adb shell monkey -p com.taolive.phone -c android.intent.category.LAUNCHER 1 || true
          sleep 60
          adb shell "dumpsys activity activities | grep -i taolive.phone" || echo "ACTIVITY_NOT_TOP"
          adb logcat -d > logcat-full.txt || true
          adb shell screencap -p /sdcard/launch.png && adb pull /sdcard/launch.png launch-60s.png || true
          sleep 120
          adb shell screencap -p /sdcard/launch.png && adb pull /sdcard/launch.png launch-180s.png || true
          adb shell "dumpsys activity processes | grep -i taolive.phone | head -20" > proc-info.txt || true
          adb shell "ps -A | grep taolive" > proc-ps.txt || true
          adb shell "dumpsys dropbox --print" > dropbox.txt 2>/dev/null || echo "NO_DROPBOX"
          grep -c taolive dropbox.txt > dropbox-taolive-count.txt || true

      - name: Full-state walkthrough screenshots (制度必截状态清单)
        run: |
          chmod +x scripts/phone-walkthrough.sh
          scripts/phone-walkthrough.sh walk
          ls -la walk/

      - name: Dump emulator log
        if: always()
        run: cat emulator.log 2>/dev/null | tail -150 || echo "NO_EMULATOR_LOG"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taolive-phone-crash-evidence
          path: |
            logcat-full.txt
            logcat-continuous.txt
            dropbox.txt
            launch-60s.png
            launch-180s.png
            proc-info.txt
            proc-ps.txt
            emulator.log
            walk/*.png
            walk/ui-tree-final.xml
            walk/walkthrough-logcat.txt
          if-no-files-found: warn
